<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeoSeva Admin</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <h1>NeoSeva <span>Admin</span></h1>
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand">NeoSeva <span>Admin</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <span id="who"></span>
        <button id="logout" class="link">Sign out</button>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <button id="menu" class="icon" aria-label="Menu">☰</button>
        <div>
          <h2 id="title"></h2>
          <p id="subtitle" class="muted"></p>
        </div>
        <div id="actions" class="actions"></div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <header><h3 id="modal-title"></h3><button class="icon" value="cancel" aria-label="Close">✕</button></header>
      <div id="modal-body"></div>
      <p id="modal-error" class="error"></p>
      <footer id="modal-foot"></footer>
    </form>
  </dialog>
  <div id="toast" class="toast"></div>
  <script src="/admin/static/admin.js"></script>
</body>
</html>
